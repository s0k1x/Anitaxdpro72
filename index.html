<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050d">
<title>Para ti 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<canvas id="stars" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- 0) PANTALLA DE INICIO (el toque permite que suene la música en el móvil) -->
<div id="gate" class="screen">
  <div class="gate-emoji">💜</div>
  <h1 class="script gate-title">Tengo algo para ti</h1>
  <p class="gate-sub">Sube el volumen o ponte los cascos 🎧</p>
  <button class="btn btn--purple" id="start" type="button"><span class="button_top">Empezar 💜</span></button>
</div>

<!-- 1) PANTALLA DE CARGA -->
<div id="loader" class="screen hidden">
  <div class="loader-wrap">
  <div class="camp">
    <div class="forest">
      <div class="tree tree1"><div class="branch branch-top"></div><div class="branch branch-middle"></div></div>
      <div class="tree tree2"><div class="branch branch-top"></div><div class="branch branch-middle"></div><div class="branch branch-bottom"></div></div>
      <div class="tree tree3"><div class="branch branch-top"></div><div class="branch branch-middle"></div><div class="branch branch-bottom"></div></div>
      <div class="tree tree4"><div class="branch branch-top"></div><div class="branch branch-middle"></div><div class="branch branch-bottom"></div></div>
      <div class="tree tree5"><div class="branch branch-top"></div><div class="branch branch-middle"></div><div class="branch branch-bottom"></div></div>
      <div class="tree tree6"><div class="branch branch-top"></div><div class="branch branch-middle"></div><div class="branch branch-bottom"></div></div>
      <div class="tree tree7"><div class="branch branch-top"></div><div class="branch branch-middle"></div><div class="branch branch-bottom"></div></div>
    </div>

    <div class="tent">
      <div class="roof"></div>
      <div class="roof-border-left">
        <div class="roof-border roof-border1"></div>
        <div class="roof-border roof-border2"></div>
        <div class="roof-border roof-border3"></div>
      </div>
      <div class="entrance">
        <div class="door left-door"><div class="left-door-inner"></div></div>
        <div class="door right-door"><div class="right-door-inner"></div></div>
      </div>
    </div>

    <div class="floor">
      <div class="ground ground1"></div>
      <div class="ground ground2"></div>
    </div>

    <div class="fireplace">
      <div class="support"></div>
      <div class="support"></div>
      <div class="bar"></div>
      <div class="hanger"></div>
      <div class="smoke"></div>
      <div class="pan"></div>
      <div class="fire">
        <div class="line line1">
          <div class="particle particle1"></div><div class="particle particle2"></div><div class="particle particle3"></div><div class="particle particle4"></div>
        </div>
        <div class="line line2">
          <div class="particle particle1"></div><div class="particle particle2"></div><div class="particle particle3"></div><div class="particle particle4"></div>
        </div>
        <div class="line line3">
          <div class="particle particle1"></div><div class="particle particle2"></div><div class="particle particle3"></div><div class="particle particle4"></div>
        </div>
      </div>
    </div>

    <div class="time-wrapper">
      <div class="time">
        <div class="day"></div>
        <div class="night">
          <div class="moon"></div>
          <div class="star star1 star-big"></div>
          <div class="star star2 star-big"></div>
          <div class="star star3 star-big"></div>
          <div class="star star4"></div>
          <div class="star star5"></div>
          <div class="star star6"></div>
          <div class="star star7"></div>
        </div>
      </div>
    </div>
  </div>
</div>
  <p id="loaderText" class="script">Cargando recuerdos…</p>
  <div class="progress"><div id="barFill"></div></div>
  <span id="pct">0%</span>
</div>

<!-- 2) ANIMACIÓN DE RECUERDOS -->
<div id="intro" class="screen hidden">
  <div id="scene"></div>
  <div class="dots" id="dots"></div>
  <button class="btn btn--blue" id="skip" type="button"><span class="button_top">Saltar</span></button>
</div>

<!-- 3) CONTENIDO PRINCIPAL (aparece al acabar la animación) -->
<main id="main" class="hidden">

  <header class="hero">
    <div class="script hi">para ti,</div>
    <h1 id="nombre">Nombre</h1>
    <p id="introTxt" class="lead"></p>

    <div class="env" id="env" aria-hidden="true">
      <div class="back"></div>
      <div class="sheet"><span>💜</span></div>
      <div class="front"></div>
      <div class="flap"></div>
    </div>

    <button class="btn btn--purple" id="openLetter" type="button"><span class="button_top">Abrir mi carta 💌</span></button>
    <article class="paper hidden" id="paper"></article>
  </header>

  <section id="historia">
    <h2 class="title reveal">Nuestra historia</h2>
    <p class="sub reveal">Los momentos que nos han traído hasta aquí</p>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="galeria">
    <h2 class="title reveal">Nuestros recuerdos</h2>
    <p class="sub reveal">Toca una foto para verla grande</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="cartas">
    <h2 class="title reveal">Cosas que quiero decirte</h2>
    <p class="sub reveal">Toca cada sobre para abrirlo</p>
    <div id="letters"></div>
  </section>

  <section class="final reveal">
    <div class="big">💖</div>
    <h2 id="finalTitle"></h2>
    <p class="script" id="finalText"></p>
    <button class="btn btn--blue" id="replay" type="button"><span class="button_top">Ver la animación otra vez</span></button>
  </section>
</main>

<audio id="music" loop preload="auto">
  <!-- Renombra tu canción a cancion.mp3 y ponla junto a index.html -->
  <source src="cancion.mp3" type="audio/mpeg">
  <!-- Plan B: el mismo archivo desde tu repositorio de GitHub -->
  <source src="https://github.com/s0k1x/Anitaxdpro72/raw/8f6493c8cfc845437172e2089eec617f8f720b7f/Marc%2520Segui%25CC%2581%2520-%2520Tiroteo%2520Remix%2520ft.%2520Rauw%2520Alejandro%2520y%2520Pol%2520Granch%2520(Videoclip%2520Oficial)%2520-%2520Marc%2520Segui%25CC%2581.mp3" type="audio/mpeg">
</audio>
<button class="btn btn--blue music-btn hidden" id="musicBtn" type="button" aria-label="Activar o silenciar la música"><span class="button_top">🔊</span></button>

<div class="lb" id="lb"></div>
<div class="burst" id="burst" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
